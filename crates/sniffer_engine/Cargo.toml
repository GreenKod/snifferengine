[package]
name = "sniffer_engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
default = []
devkit = [
    "sniffer_core/devkit",
    "sniffer_render/devkit",
    "sniffer_plugin/devkit",
    "sniffer_platform_desktop/devkit",
    "sniffer_platform_android/devkit",
]

[dependencies]
sniffer_core = { path = "../sniffer_core" }
sniffer_render = { path = "../sniffer_render" }
sniffer_plugin = { path = "../sniffer_plugin" }
sniffer_pkg = { path = "../sniffer_pkg" }
sniffer_platform_desktop = { path = "../sniffer_platform_desktop" }

[target.'cfg(target_os = "android")'.dependencies]
sniffer_platform_android = { path = "../sniffer_platform_android" }
android-activity = { version = "0.6.1", features = ["native-activity"] }

[lints]
workspace = true

