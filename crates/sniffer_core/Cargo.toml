[package]
name = "sniffer_core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
default = []
devkit = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
taffy = "0.5"
obfstr = "0.4"
swash = { version = "0.2.9", features = ["scale"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "frame_pipeline"
harness = false

[lints]
workspace = true
