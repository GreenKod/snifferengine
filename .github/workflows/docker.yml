# ==============================================================================
# SnifferEngine Docker Environment Validation (vault plan 0002 — Section 3)
# ==============================================================================
# Standalone by design (plan rule 7): this workflow owns ALL Docker
# validation with its own triggers. The consolidated check.yml and
# .github/paths.yaml are never modified, and this workflow never triggers
# or blocks the consolidated quality workflow.
#
# Trigger policy (maintainer decision, 2026-11-21): every push and every
# PR runs the validation — not only docker-relevant paths — because the
# in-container gate run (stage 3.3) proves the whole repository against
# the container environment, so any commit can break it.
#
# Stage markers follow vault plan 0002: stages 3.2-3.3 carry the image
# build (raw docker buildx steps — decided over a third-party build action:
# no new action supply-chain surface, explicit BuildKit cache semantics),
# the entrypoint parity smoke, the full in-container gate run, and the
# digest/size record; stages 3.4-3.6 add Android validation and drift
# tracking on top.
# ==============================================================================

name: SnifferEngine Docker Environment Validation

on:
  push:
    # Every commit: the in-container gate run (stage 3.3) proves the whole
    # repository against the container environment, so any commit can
    # break it — no path filtering.
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
  schedule:
    # Thursday 06:37 UTC — offset minute avoids the top-of-hour API spike
    # (house pattern: patch-freshness.yml).
    - cron: "37 6 * * 4"

permissions:
  contents: read
  # issues: write is granted from stage 3.5, scoped to the drift-tracking
  # job — the skeleton needs nothing beyond read access.

jobs:
  validate-gates:
    name: Build Image and Validate Quality Gates
    runs-on: ubuntu-latest
    # A full in-container workspace compile takes tens of minutes on a cold
    # cache; 60 minutes bounds the job against hung runs without cutting
    # legitimate builds short.
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Decision (stage 3.2): raw docker buildx steps, not a third-party
      # build action — no new action supply-chain surface and fully explicit
      # cache semantics. BuildKit's gha cache (mode=max exports intermediate
      # layers) makes rebuilds incremental across runs.
      - name: Build the Dev Image (BuildKit, gha layer cache)
        run: |
          set -eu
          docker buildx build \
            --file docker/Dockerfile \
            --target dev \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag snifferengine-dev:ci \
            .

      # Boot the freshly built image with the repository mounted at
      # /workspace: the entrypoint runs its three-way toolchain parity
      # assertion (toml == baked image record == rustc) and the environment
      # exports, then hands over to `true`. The full scripts/check.sh gate
      # run lands in stage 3.3.
      - name: Entrypoint Parity Smoke
        run: |
          set -eu
          docker run --rm \
            --volume "$PWD:/workspace" \
            snifferengine-dev:ci \
            true

      # The full 8-gate proof (plan stage 3.3): scripts/check.sh runs INSIDE
      # the freshly built image against the checked-out repository — the
      # container must be a complete drop-in for local development. The
      # entrypoint's three-way parity assertion runs first (defense in
      # depth), then the gates execute in /workspace. Invoked through bash
      # because scripts/check.sh carries no executable bit in git (same
      # convention as the consolidated check.yml).
      - name: Validate Quality Gates (in-container scripts/check.sh)
        run: |
          set -eu
          docker run --rm \
            --volume "$PWD:/workspace" \
            snifferengine-dev:ci \
            bash ./scripts/check.sh

      # Fulfills plan stage 1.6's deferred "digest recorded" evidence and
      # gives reviewers an immediate size signal.
      - name: Record Image Digest and Size
        run: |
          set -eu
          DIGEST="$(docker inspect --format '{{.Id}}' snifferengine-dev:ci)"
          SIZE_BYTES="$(docker image inspect snifferengine-dev:ci --format '{{.Size}}')"
          SIZE_MB="$((SIZE_BYTES / 1024 / 1024))"
          {
            echo "### Docker Dev Image (target: dev)"
            echo "- digest: \`${DIGEST}\`"
            echo "- size: ${SIZE_MB} MB"
          } >> "$GITHUB_STEP_SUMMARY"
