# ==============================================================================
# SnifferEngine Docker Environment Validation (vault plan 0002 — Section 3)
# ==============================================================================
# Standalone by design (plan rule 7): this workflow owns ALL Docker
# validation with its own triggers. The consolidated check.yml and
# .github/paths.yaml are never modified, and this workflow never triggers
# or blocks the consolidated quality workflow.
#
# Trigger policy (maintainer decision, 2026-11-21): every push and every
# PR runs the validation — not only docker-relevant paths — because the
# in-container gate run (stage 3.3) proves the whole repository against
# the container environment, so any commit can break it.
#
# Stage markers follow vault plan 0002: stages 3.2-3.4 carry the image
# build (raw docker buildx steps — decided over a third-party build action:
# no new action supply-chain surface, explicit BuildKit cache semantics),
# the entrypoint parity smoke, the full in-container gate run, the Android
# validation, and the digest/size record; stage 3.5 adds the scheduled
# drift-tracking issue lifecycle; stage 3.6 adds base-image digest drift
# detection; stage 3.7 keeps the promotion and registry decisions open.
# ==============================================================================

name: SnifferEngine Docker Environment Validation

on:
  # Single-run-per-commit policy (maintainer decision, 2026-11-21): the
  # pull_request trigger was removed — with push covering every branch, a
  # PR-branch push would otherwise fire BOTH events (push + synchronize)
  # and run the workflow twice per commit.
  push:
    # Every commit: the in-container gate run (stage 3.3) proves the whole
    # repository against the container environment, so any commit can
    # break it — no path filtering.
    branches: ["**"]
  workflow_dispatch:
  schedule:
    # Thursday 06:37 UTC — offset minute avoids the top-of-hour API spike
    # (house pattern: patch-freshness.yml).
    - cron: "37 6 * * 4"

permissions:
  contents: read
  # issues: write is granted from stage 3.5, scoped to the drift-tracking
  # job — the skeleton needs nothing beyond read access.

jobs:
  validate-gates:
    name: Build Image and Validate Quality Gates
    runs-on: ubuntu-latest
    # A full in-container workspace compile takes tens of minutes on a cold
    # cache; 60 minutes bounds the job against hung runs without cutting
    # legitimate builds short.
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Decision (stage 3.2): raw docker buildx steps, not a third-party
      # build action — no new action supply-chain surface and fully explicit
      # cache semantics. BuildKit's gha cache (mode=max exports intermediate
      # layers) makes rebuilds incremental across runs.
      - name: Build the Dev Image (BuildKit, gha layer cache)
        run: |
          set -eu
          docker buildx build \
            --file docker/Dockerfile \
            --target dev \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag snifferengine-dev:ci \
            .

      # Boot the freshly built image with the repository mounted at
      # /workspace: the entrypoint runs its three-way toolchain parity
      # assertion (toml == baked image record == rustc) and the environment
      # exports, then hands over to `true`. The full scripts/check.sh gate
      # run lands in stage 3.3.
      - name: Entrypoint Parity Smoke
        run: |
          set -eu
          docker run --rm \
            --volume "$PWD:/workspace" \
            snifferengine-dev:ci \
            true

      # The full 8-gate proof (plan stage 3.3): scripts/check.sh runs INSIDE
      # the freshly built image against the checked-out repository — the
      # container must be a complete drop-in for local development. The
      # entrypoint's three-way parity assertion runs first (defense in
      # depth), then the gates execute in /workspace. Invoked through bash
      # because scripts/check.sh carries no executable bit in git (same
      # convention as the consolidated check.yml).
      - name: Validate Quality Gates (in-container scripts/check.sh)
        run: |
          set -eu
          docker run --rm \
            --volume "$PWD:/workspace" \
            snifferengine-dev:ci \
            bash ./scripts/check.sh

      # Fulfills plan stage 1.6's deferred "digest recorded" evidence and
      # gives reviewers an immediate size signal.
      - name: Record Image Digest and Size
        run: |
          set -eu
          DIGEST="$(docker inspect --format '{{.Id}}' snifferengine-dev:ci)"
          SIZE_BYTES="$(docker image inspect snifferengine-dev:ci --format '{{.Size}}')"
          SIZE_MB="$((SIZE_BYTES / 1024 / 1024))"
          {
            echo "### Docker Dev Image (target: dev)"
            echo "- digest: \`${DIGEST}\`"
            echo "- size: ${SIZE_MB} MB"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------------------
  # validate-android (vault plan 0002 — stage 3.4): the Stage 2.3 Android
  # gates inside the freshly built image, mirroring the consolidated CI's
  # Android job. Rebuilds from the gha layer cache; the parity assert runs
  # first so drift fails before a compile cycle is wasted.
  # ------------------------------------------------------------------------------
  validate-android:
    name: Build Image and Validate Android Cross-Checks
    runs-on: ubuntu-latest
    # Two full android-target dependency compilations share the repository
    # target dir through the mount; 90 minutes bounds the cold-cache worst
    # case without cutting legitimate runs short.
    timeout-minutes: 90
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same raw docker buildx approach as validate-gates; the gha layer
      # cache (mode=max) makes this rebuild incremental on every commit.
      - name: Build the Dev Image (BuildKit, gha layer cache)
        run: |
          set -eu
          docker buildx build \
            --file docker/Dockerfile \
            --target dev \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag snifferengine-dev:ci \
            .

      # Stage 2.3's drift assert: the image's NDK / build-tools / platform
      # must equal the check.yml pins — fail hard before any compiling.
      - name: Assert Android Version Parity (image vs check.yml)
        run: |
          set -eu
          docker run --rm \
            --volume "$PWD:/workspace" \
            snifferengine-dev:ci \
            bash docker/android-parity.sh

      # CI parity (check.yml validate-android): aarch64 clippy. The bindgen
      # target pin (API 30) comes from the image ENV block.
      - name: Android (ARM64) Clippy
        run: |
          set -eu
          docker run --rm \
            --volume "$PWD:/workspace" \
            snifferengine-dev:ci \
            cargo ndk --target aarch64-linux-android clippy --locked --workspace --all-targets -- -D warnings

      - name: Android (Emulator x86_64) Clippy
        run: |
          set -eu
          docker run --rm \
            --volume "$PWD:/workspace" \
            snifferengine-dev:ci \
            cargo ndk --target x86_64-linux-android clippy --locked --workspace --all-targets -- -D warnings

  # ------------------------------------------------------------------------------
  # drift-tracker (vault plan 0002 — stage 3.5): the patch-freshness.yml
  # lifecycle, adapted to the push-only trigger policy. Every-commit push
  # runs already gate the author directly, so the labeled tracking issue
  # fires ONLY on scheduled/manual runs: a red run opens or comments the
  # `docker-environment-drift` issue, and the next green run closes it.
  # ------------------------------------------------------------------------------
  drift-tracker:
    name: Docker Environment Drift Tracker
    runs-on: ubuntu-latest
    needs: [validate-gates, validate-android]
    if: always() && github.event_name != 'push'
    # Scoped grant (the workflow-level default stays contents: read): this
    # job never checks out code, it only talks to the issue tracker.
    permissions:
      issues: write
    steps:
      - name: Consolidate Validation Results
        id: results
        run: |
          set -eu
          GATES="${{ needs.validate-gates.result }}"
          ANDROID="${{ needs.validate-android.result }}"
          echo "validate-gates=${GATES} validate-android=${ANDROID}"
          if [ "${GATES}" = "success" ] && [ "${ANDROID}" = "success" ]; then
            echo "status=green" >> "$GITHUB_OUTPUT"
          else
            echo "status=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or Update Tracking Issue
        if: steps.results.outputs.status == 'red'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          # Ensure the tracker label exists (idempotent).
          gh api --method POST "repos/${{ github.repository }}/labels" \
            -f name="docker-environment-drift" \
            -f color="BFD4F2" \
            -f description="The Docker development environment needs attention" \
            --silent > /dev/null 2>&1 || true
          printf '%s\n' \
            "The scheduled Docker environment validation failed: the container no longer satisfies the repository quality gates or the Android parity contract." \
            "" \
            "- Failing run: ${RUN_URL}" \
            "- Likely attention points: docker/Dockerfile pins, docker-compose.yml, or upstream digest drift" \
            "- Local reproduction: docker compose build && docker compose run --rm dev ./scripts/check.sh" \
            > /tmp/tracker-issue-body.md
          OPEN_ISSUES=$(gh issue list --label "docker-environment-drift" --state open --json number --jq '.[].number')
          if [ -z "$OPEN_ISSUES" ]; then
            gh issue create \
              --title "Docker development environment validation is failing" \
              --body-file /tmp/tracker-issue-body.md \
              --label "docker-environment-drift"
          else
            for issue in $OPEN_ISSUES; do
              gh issue comment "$issue" --body "Scheduled validation is still failing: ${RUN_URL}"
            done
          fi

      - name: Close Resolved Tracking Issue
        if: steps.results.outputs.status == 'green'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          OPEN_ISSUES=$(gh issue list --label "docker-environment-drift" --state open --json number --jq '.[].number')
          for issue in $OPEN_ISSUES; do
            gh issue close "$issue" --comment "Validation is green again: ${RUN_URL}"
          done

  # ------------------------------------------------------------------------------
  # digest-drift (vault plan 0002 — stage 3.6): compares the pinned base image
  # digest in docker/Dockerfile against the live Docker Hub tag. Runs on every
  # event (one curl, non-fatal by design): upstream movement becomes visible
  # the moment the repository is touched, not only on the weekly schedule.
  # Three tiers: a missing pin is a hard failure (the pin rule); a Hub outage
  # is a soft warning with no issue churn; a real drift opens or updates a
  # labeled issue and never blocks the run. A fresh comparison closes open
  # drift issues again.
  # ------------------------------------------------------------------------------
  digest-drift:
    name: Base Image Pin Freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare Pinned Base Digest With Docker Hub
        id: drift
        run: |
          set -eu
          PINNED="$(grep -m1 -o 'FROM debian:trixie-slim@sha256:[0-9a-f]*' docker/Dockerfile | cut -d'@' -f2)"
          if [ -z "$PINNED" ]; then
            echo "::error::no digest-pinned FROM line found in docker/Dockerfile — the pin rule is non-negotiable"
            exit 1
          fi
          CURRENT="$(curl -fsSL --max-time 30 \
            https://hub.docker.com/v2/repositories/library/debian/tags/trixie-slim \
            | jq -r '.digest' || true)"
          if [ -z "$CURRENT" ]; then
            echo "::warning title=Docker Hub unreachable::cannot compare the pinned base digest this run"
            echo "drifted=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pinned:   ${PINNED}"
          echo "upstream: ${CURRENT}"
          {
            echo "pinned=${PINNED}"
            echo "current=${CURRENT}"
          } >> "$GITHUB_OUTPUT"
          if [ "${PINNED}" = "${CURRENT}" ]; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or Update Digest Drift Issue
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PINNED_DIGEST: ${{ steps.drift.outputs.pinned }}
          CURRENT_DIGEST: ${{ steps.drift.outputs.current }}
        run: |
          set -eu
          echo "::warning title=Base image digest drift::debian:trixie-slim moved upstream — see the docker-digest-drift issue"
          gh api --method POST "repos/${{ github.repository }}/labels" \
            -f name="docker-digest-drift" \
            -f color="BFD4F2" \
            -f description="The pinned base image digest is behind upstream" \
            --silent > /dev/null 2>&1 || true
          printf '%s\n' \
            "The pinned base image digest no longer matches the live Docker Hub tag:" \
            "" \
            "- pinned:   ${PINNED_DIGEST}" \
            "- current: ${CURRENT_DIGEST}" \
            "- run: ${RUN_URL}" \
            "" \
            "Update procedure: bump the FROM digest in docker/Dockerfile (the pin-update helper lands with vault plan 0002 stage 4.2) and re-run the validation." \
            > /tmp/digest-drift-body.md
          OPEN_ISSUES=$(gh issue list --label "docker-digest-drift" --state open --json number --jq '.[].number')
          if [ -z "$OPEN_ISSUES" ]; then
            gh issue create \
              --title "Pinned base image digest is behind upstream" \
              --body-file /tmp/digest-drift-body.md \
              --label "docker-digest-drift"
          else
            for issue in $OPEN_ISSUES; do
              gh issue comment "$issue" --body "Digest is still behind upstream: ${RUN_URL}"
            done
          fi

      - name: Close Resolved Digest Drift Issue
        if: steps.drift.outputs.drifted == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          OPEN_ISSUES=$(gh issue list --label "docker-digest-drift" --state open --json number --jq '.[].number')
          for issue in $OPEN_ISSUES; do
            gh issue close "$issue" --comment "Pinned digest matches upstream again: ${RUN_URL}"
          done
