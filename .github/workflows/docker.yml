# ==============================================================================
# SnifferEngine Docker Environment Validation (vault plan 0002 — Section 3)
# ==============================================================================
# Standalone by design (plan rule 7): this workflow owns ALL Docker
# validation with its own inline path filters. The consolidated check.yml
# and .github/paths.yaml are never modified, and Docker-relevant changes
# never trigger or block the consolidated quality workflow.
#
# Lifecycle (house pattern, patch-freshness.yml):
#   • push/PR runs (paths-filtered) gate the author's own docker changes —
#     always blocking.
#   • scheduled runs are strict; a failing scheduled run opens or updates a
#     labeled tracking issue that stays open until a green run closes it
#     (wired in stages 3.5/3.6).
#
# Stage markers follow vault plan 0002: stage 3.2 carries the image build
# (raw docker buildx steps — decided over a third-party build action: no new
# action supply-chain surface, explicit BuildKit cache semantics), the
# entrypoint parity smoke, and the digest/size record; stages 3.3-3.6 add the
# full gate runs and drift tracking on top.
# ==============================================================================

name: SnifferEngine Docker Environment Validation

on:
  push:
    branches: ["master"]
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/check.sh"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/check.sh"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
  schedule:
    # Thursday 06:37 UTC — offset minute avoids the top-of-hour API spike
    # (house pattern: patch-freshness.yml).
    - cron: "37 6 * * 4"

permissions:
  contents: read
  # issues: write is granted from stage 3.5, scoped to the drift-tracking
  # job — the skeleton needs nothing beyond read access.

jobs:
  build:
    name: Build Dev Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Decision (stage 3.2): raw docker buildx steps, not a third-party
      # build action — no new action supply-chain surface and fully explicit
      # cache semantics. BuildKit's gha cache (mode=max exports intermediate
      # layers) makes rebuilds incremental across runs.
      - name: Build the Dev Image (BuildKit, gha layer cache)
        run: |
          set -eu
          docker buildx build \
            --file docker/Dockerfile \
            --target dev \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag snifferengine-dev:ci \
            .

      # Boot the freshly built image with the repository mounted at
      # /workspace: the entrypoint runs its three-way toolchain parity
      # assertion (toml == baked image record == rustc) and the environment
      # exports, then hands over to `true`. The full scripts/check.sh gate
      # run lands in stage 3.3.
      - name: Entrypoint Parity Smoke
        run: |
          set -eu
          docker run --rm \
            --volume "$PWD:/workspace" \
            snifferengine-dev:ci \
            true

      # Fulfills plan stage 1.6's deferred "digest recorded" evidence and
      # gives reviewers an immediate size signal.
      - name: Record Image Digest and Size
        run: |
          set -eu
          DIGEST="$(docker inspect --format '{{.Id}}' snifferengine-dev:ci)"
          SIZE_BYTES="$(docker image inspect snifferengine-dev:ci --format '{{.Size}}')"
          SIZE_MB="$((SIZE_BYTES / 1024 / 1024))"
          {
            echo "### Docker Dev Image (target: dev)"
            echo "- digest: \`${DIGEST}\`"
            echo "- size: ${SIZE_MB} MB"
          } >> "$GITHUB_STEP_SUMMARY"
