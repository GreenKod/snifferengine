name: SnifferEngine Nix Environment Validation

# ==============================================================================
# Standalone continuous validation of the Nix-managed development
# environment (vault plan 0001, section 3; ADR 001).
#
# This workflow owns its inline path filters and shares nothing with the
# consolidated quality workflow: no .github/paths.yaml category is added
# and check.yml is never modified by the Nix work. A Nix change validates
# here on its own; unrelated changes never trigger it.
#
# Trigger semantics (vault plan stage 3.6):
#   * push/PR on the nix surface — blocking validation of author changes;
#     no tracking issues, the failing run itself is the signal
#   * workflow_dispatch — on-demand proof, tracked like scheduled runs
#   * weekly schedule — drift detection against a moving runner world;
#     failures on scheduled/dispatch runs open a labeled tracking issue
#     (nix-environment-drift) that stays open until a green run closes it
#
# Promotion policy (vault plan stage 3.7, decided 2026-11-21):
#   This workflow stays ADVISORY — it is not a required branch check yet.
#   The promotion itself is a repository settings change (Settings →
#   Branches → required status checks), not a file change. Revisit the
#   decision only after the first four consecutive green weekly scheduled
#   runs have landed (first fire 2026-11-25 → earliest review ≈
#   2026-12-16); a scheduled failure resets the count, and the open
#   nix-environment-drift issue explains why. Until then, pushes and PRs
#   still show this workflow red/green for their own nix changes.
# ==============================================================================

on:
  push:
    branches: ["**"]
    paths:
      - "nix/**"
      - "shell.nix"
      - "shell-android.nix"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/check.sh"
      - "scripts/update-nix-pins.sh"
      - ".github/workflows/nix.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "nix/**"
      - "shell.nix"
      - "shell-android.nix"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/check.sh"
      - "scripts/update-nix-pins.sh"
      - ".github/workflows/nix.yml"
  workflow_dispatch:
  schedule:
    # Wednesday 06:23 UTC — offset minute avoids the top-of-hour API spike
    # (house pattern: patch-freshness.yml runs Monday 06:17).
    - cron: "23 6 * * 3"

permissions:
  contents: read
  # Used only by the scheduled drift-tracking job (vault plan stage 3.6).
  issues: write

jobs:
  skeleton:
    name: Workflow Skeleton & Nix Surface Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the Nix Surface Exists
        run: |
          missing=0
          for f in \
            shell.nix \
            nix/pins.nix \
            nix/rust.nix \
            nix/host-deps.nix \
            nix/shell-hook.nix \
            scripts/update-nix-pins.sh \
            scripts/check.sh; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::missing nix surface file"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::the guarded nix surface is incomplete"
            exit 1
          fi
          echo "Nix surface present: 5 nix modules + 2 guarded scripts"

      - name: Print Trigger Context
        run: |
          echo "event   : ${{ github.event_name }}"
          echo "ref     : ${{ github.ref }}"
          echo "schedule: 23 6 * * 3 (weekly, Wednesday 06:23 UTC)"
          echo "purpose : continuously prove the pinned nix environment"

  # ------------------------------------------------------------------
  # Stage 3.2 — Nix on the runner: SHA-pinned install, a download-cache
  # strategy keyed by the pin layer, and the first real nix-level
  # evaluation of nix/pins.nix (syntax, parse, and attr coherence).
  # ------------------------------------------------------------------
  nix-bootstrap:
    name: Nix Install & Pin-Layer Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Restore Nix Download Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nix
          # New pins invalidate the key automatically.
          key: nix-downloads-v1-${{ hashFiles('nix/pins.nix') }}
          restore-keys: nix-downloads-v1-

      - name: Report Nix Version
        run: nix --version

      - name: Evaluate the Pin Layer
        run: |
          # The pin layer is a pure attribute set: evaluating it costs no
          # download and proves nix syntax, parse, and file/eval coherence.
          for pin in nixpkgs rust-overlay; do
            eval_rev=$(nix-instantiate --eval nix/pins.nix -A "$pin.rev" | tr -d '"')
            file_rev=$(sed -n "/# pin:$pin-rev$/{n;s/.*rev = \"\([0-9a-f]*\)\";/\1/p;}" nix/pins.nix)
            if [ -z "$file_rev" ]; then
              echo "::error file=nix/pins.nix::anchor parse failed for $pin"
              exit 1
            fi
            if [ "$eval_rev" != "$file_rev" ]; then
              echo "::error file=nix/pins.nix::$pin rev mismatch: eval=$eval_rev file=$file_rev"
              exit 1
            fi
            echo "$pin rev evaluates to ${eval_rev:0:12}… (file and eval agree)"
          done

  # ------------------------------------------------------------------
  # Stage 3.3 — Fast smoke proof of the pinned environment: entering
  # the pure shell runs the hard toolchain parity assertion (the shell
  # hook exits 1 on mismatch), then the workspace compiles and the
  # framework JS parses — all against the pinned dependency closure.
  # ------------------------------------------------------------------
  validate-shell:
    name: Validate Shell (parity + cargo check + framework JS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Restore Nix Download Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nix
          key: nix-downloads-v1-${{ hashFiles('nix/pins.nix') }}
          restore-keys: nix-downloads-v1-

      # One invocation builds the shell derivation once; the shell hook
      # performs the toolchain parity assertion during entry (exit 1 on
      # mismatch fails this step), then the smoke set runs inside the
      # pure environment.
      - name: Validate Inside the Pure Pinned Shell
        run: |
          nix-shell --pure --run '
            set -euo pipefail
            echo "::group::Toolchain (parity asserted by the shell hook on entry)"
            rustc --version
            cargo --version
            echo "::endgroup::"
            echo "::group::cargo check --locked --workspace"
            cargo check --locked --workspace
            echo "::endgroup::"
            echo "::group::Framework JS syntax (scripts/check.sh step 3)"
            node --check framework/core.js
            node --check framework/sniffer_ui.js
            echo "::endgroup::"
            echo "validate-shell: pinned environment smoke PASSED"
          '

  # ------------------------------------------------------------------
  # Stage 3.5 — Android cross-compilation parity inside the pure
  # pinned android shell (shell-android.nix): the SDK/NDK composition
  # is pinned to the CI validate-android set (nix/android.nix), and
  # cargo-ndk proves the same targets the runner-side job proves.
  # ------------------------------------------------------------------
  validate-android:
    name: Validate Android (NDK cross-compile, pure shell)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Restore Nix Download Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nix
          key: nix-downloads-v1-${{ hashFiles('nix/pins.nix') }}
          restore-keys: nix-downloads-v1-

      # Inventory of the pinned toolchain: proves which rustlib targets the
      # aggregated rust-bin toolchain actually carries, and that rustc/cargo
      # really resolve into the pinned closure instead of a host rustup shim
      # (kept as a cheap permanent diagnostic).
      - name: Diagnose the Pinned Android Toolchain
        run: |
          # shellcheck disable=SC2016
          # The expressions below must expand inside the inner nix-shell
          # bash, not in this outer step shell.
          nix-shell shell-android.nix --pure --run '
            set -euo pipefail
            echo "--- PATH entries ---"
            printf "%s\n" "${PATH}" | tr ":" "\n"
            echo "--- cargo home ---"
            echo "HOME      : ${HOME}"
            echo "CARGO_HOME: ${CARGO_HOME:-unset (defaults to ~/.cargo)}"
            echo "--- resolution ---"
            echo "rustc    : $(command -v rustc)"
            echo "cargo    : $(command -v cargo)"
            echo "rustc -> : $(readlink -f "$(command -v rustc)")"
            echo "cargo -> : $(readlink -f "$(command -v cargo)")"
            echo "--- external subcommand resolution (cargo home vs PATH) ---"
            for sub in cargo-clippy cargo-fmt cargo-machete cargo-ndk; do
              printf "%-14s: %s\n" "$sub" "$(command -v "$sub" || echo missing)"
            done
            echo "--- rustup / cargo env ---"
            env | grep -E "^(RUST|CARGO)" | sort || true
            echo "--- versions ---"
            echo "rustc  : $(rustc --version)"
            echo "cargo  : $(cargo --version)"
            echo "sysroot: $(rustc --print sysroot)"
            echo "--- rustlib inventory ---"
            ls "$(rustc --print sysroot)/lib/rustlib"
          '

      # The android-mode hook exports ANDROID_HOME/NDK_ROOT and the CI's
      # BINDGEN_EXTRA_CLANG_ARGS per target, then fails fast if the NDK
      # layout is missing.
      - name: Cross-Compile Inside the Pure Pinned Android Shell
        run: |
          # shellcheck disable=SC2016
          # ANDROID_NDK_ROOT below must expand inside the inner nix-shell
          # bash, not in this outer step shell.
          nix-shell shell-android.nix --pure --run '
            set -euo pipefail
            echo "::group::Android environment (asserted by the shell hook)"
            echo "NDK: ${ANDROID_NDK_ROOT}"
            echo "::endgroup::"
            echo "::group::Toolchain resolution"
            echo "rustc: $(command -v rustc) -> $(readlink -f "$(command -v rustc)")"
            echo "cargo: $(command -v cargo) -> $(readlink -f "$(command -v cargo)")"
            echo "clippy: $(command -v cargo-clippy) -> $(readlink -f "$(command -v cargo-clippy)")"
            echo "::endgroup::"
            echo "::group::Android (ARM64) Check & Clippy"
            cargo ndk --target aarch64-linux-android clippy --locked --workspace --all-targets -- -D warnings
            echo "::endgroup::"
            echo "::group::Android (Emulator x86_64) Check & Clippy"
            cargo ndk --target x86_64-linux-android clippy --locked --workspace --all-targets -- -D warnings
            echo "::endgroup::"
            echo "validate-android: pinned NDK cross-compile smoke PASSED"
          '

  # ------------------------------------------------------------------
  # Stage 3.4 — The full local quality gate inside the pure pinned
  # shell: scripts/check.sh's 8 steps (purity, fmt, JS syntax, cargo
  # check, clippy, tests, machete, patched-crate freshness). This is
  # the proof that the Nix environment is a complete drop-in for
  # local development — the cancelled stage 1.6 gate, delivered by
  # CI as decided.
  # ------------------------------------------------------------------
  validate-gates:
    name: Validate Gates (full scripts/check.sh, pure shell)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Restore Nix Download Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nix
          key: nix-downloads-v1-${{ hashFiles('nix/pins.nix') }}
          restore-keys: nix-downloads-v1-

      # scripts/check.sh carries its own [1/8]…[8/8] stage output and
      # fails the step on the first broken gate.
      - name: Run the Full Quality Gate Inside the Pure Pinned Shell
        run: |
          nix-shell --pure --run 'bash scripts/check.sh'

  # ------------------------------------------------------------------
  # Stage 3.6 — Drift tracking for scheduled/dispatch runs (house
  # pattern: patch-freshness.yml). Push/PR failures are the author's
  # own blocking signal and never open issues. Scheduled/dispatch
  # failures open or update one labeled issue that stays open until a
  # green scheduled run closes it.
  # ------------------------------------------------------------------
  drift-tracking:
    name: Drift Tracking (scheduled runs only)
    runs-on: ubuntu-latest
    needs:
      [
        skeleton,
        nix-bootstrap,
        validate-shell,
        validate-gates,
        validate-android,
      ]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Open or Update Tracking Issue
        if: contains(needs.*.result, 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Ensure the tracker label exists (idempotent).
          gh api --method POST "repos/${{ github.repository }}/labels" \
            -f name="nix-environment-drift" \
            -f color="BFD4F2" \
            -f description="The pinned nix environment no longer validates" \
            --silent > /dev/null 2>&1 || true

          printf '%s\n' \
            "The scheduled validation of the pinned Nix environment failed: the development environment no longer builds, enters, or passes the quality gates against the current GitHub runner world." \
            "" \
            "- Audit output: see the failing scheduled run below" \
            "- Update procedure: scripts/update-nix-pins.sh (nix/pins.nix) and the shell modules under nix/" \
            "- Run: ${RUN_URL}" > /tmp/tracker-issue-body.md

          OPEN_ISSUES=$(gh issue list --label "nix-environment-drift" --state open --json number --jq '.[].number')
          if [ -z "$OPEN_ISSUES" ]; then
            gh issue create \
              --title "Nix environment no longer validates (weekly drift)" \
              --body-file /tmp/tracker-issue-body.md \
              --label "nix-environment-drift"
          else
            for issue in $OPEN_ISSUES; do
              gh issue comment "$issue" --body "Scheduled validation is still failing: ${RUN_URL}"
            done
          fi

      - name: Close Resolved Tracking Issue
        if: contains(needs.*.result, 'failure') == false && contains(needs.*.result, 'cancelled') == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          OPEN_ISSUES=$(gh issue list --label "nix-environment-drift" --state open --json number --jq '.[].number')
          for issue in $OPEN_ISSUES; do
            gh issue close "$issue" --comment "Scheduled validation is green again: ${RUN_URL}"
          done
