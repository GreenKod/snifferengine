name: SnifferEngine Nix Environment Validation

# ==============================================================================
# Standalone continuous validation of the Nix-managed development
# environment (vault plan 0001, section 3; ADR 001).
#
# This workflow owns its inline path filters and shares nothing with the
# consolidated quality workflow: no .github/paths.yaml category is added
# and check.yml is never modified by the Nix work. A Nix change validates
# here on its own; unrelated changes never trigger it.
#
# Trigger semantics (vault plan stage 3.6 will complete the story):
#   * push/PR on the nix surface — blocking validation of author changes
#   * workflow_dispatch — on-demand proof
#   * weekly schedule — drift detection against a moving runner world;
#     failures on scheduled runs will open a labeled tracking issue that
#     stays open until a green run closes it
# ==============================================================================

on:
  push:
    branches: ["**"]
    paths:
      - "nix/**"
      - "shell.nix"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/check.sh"
      - "scripts/update-nix-pins.sh"
      - ".github/workflows/nix.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "nix/**"
      - "shell.nix"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/check.sh"
      - "scripts/update-nix-pins.sh"
      - ".github/workflows/nix.yml"
  workflow_dispatch:
  schedule:
    # Wednesday 06:23 UTC — offset minute avoids the top-of-hour API spike
    # (house pattern: patch-freshness.yml runs Monday 06:17).
    - cron: "23 6 * * 3"

permissions:
  contents: read
  # Used only by the scheduled drift-tracking job (vault plan stage 3.6).
  issues: write

jobs:
  skeleton:
    name: Workflow Skeleton & Nix Surface Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the Nix Surface Exists
        run: |
          missing=0
          for f in \
            shell.nix \
            nix/pins.nix \
            nix/rust.nix \
            nix/host-deps.nix \
            nix/shell-hook.nix \
            scripts/update-nix-pins.sh \
            scripts/check.sh; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::missing nix surface file"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::the guarded nix surface is incomplete"
            exit 1
          fi
          echo "Nix surface present: 5 nix modules + 2 guarded scripts"

      - name: Print Trigger Context
        run: |
          echo "event   : ${{ github.event_name }}"
          echo "ref     : ${{ github.ref }}"
          echo "schedule: 23 6 * * 3 (weekly, Wednesday 06:23 UTC)"
          echo "purpose : continuously prove the pinned nix environment"

  # ------------------------------------------------------------------
  # Stage 3.2 — Nix on the runner: SHA-pinned install, a download-cache
  # strategy keyed by the pin layer, and the first real nix-level
  # evaluation of nix/pins.nix (syntax, parse, and attr coherence).
  # ------------------------------------------------------------------
  nix-bootstrap:
    name: Nix Install & Pin-Layer Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Restore Nix Download Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nix
          # New pins invalidate the key automatically.
          key: nix-downloads-v1-${{ hashFiles('nix/pins.nix') }}
          restore-keys: nix-downloads-v1-

      - name: Report Nix Version
        run: nix --version

      - name: Evaluate the Pin Layer
        run: |
          # The pin layer is a pure attribute set: evaluating it costs no
          # download and proves nix syntax, parse, and file/eval coherence.
          for pin in nixpkgs rust-overlay; do
            eval_rev=$(nix-instantiate --eval nix/pins.nix -A "$pin.rev" | tr -d '"')
            file_rev=$(sed -n "/# pin:$pin-rev$/{n;s/.*rev = \"\([0-9a-f]*\)\";/\1/p;}" nix/pins.nix)
            if [ -z "$file_rev" ]; then
              echo "::error file=nix/pins.nix::anchor parse failed for $pin"
              exit 1
            fi
            if [ "$eval_rev" != "$file_rev" ]; then
              echo "::error file=nix/pins.nix::$pin rev mismatch: eval=$eval_rev file=$file_rev"
              exit 1
            fi
            echo "$pin rev evaluates to ${eval_rev:0:12}… (file and eval agree)"
          done

  # ------------------------------------------------------------------
  # Stage 3.3 — Fast smoke proof of the pinned environment: entering
  # the pure shell runs the hard toolchain parity assertion (the shell
  # hook exits 1 on mismatch), then the workspace compiles and the
  # framework JS parses — all against the pinned dependency closure.
  # ------------------------------------------------------------------
  validate-shell:
    name: Validate Shell (parity + cargo check + framework JS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Restore Nix Download Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nix
          key: nix-downloads-v1-${{ hashFiles('nix/pins.nix') }}
          restore-keys: nix-downloads-v1-

      # One invocation builds the shell derivation once; the shell hook
      # performs the toolchain parity assertion during entry (exit 1 on
      # mismatch fails this step), then the smoke set runs inside the
      # pure environment.
      - name: Validate Inside the Pure Pinned Shell
        run: |
          nix-shell --pure --run '
            set -euo pipefail
            echo "::group::Toolchain (parity asserted by the shell hook on entry)"
            rustc --version
            cargo --version
            echo "::endgroup::"
            echo "::group::cargo check --locked --workspace"
            cargo check --locked --workspace
            echo "::endgroup::"
            echo "::group::Framework JS syntax (scripts/check.sh step 3)"
            node --check framework/core.js
            node --check framework/sniffer_ui.js
            echo "::endgroup::"
            echo "validate-shell: pinned environment smoke PASSED"
          '
